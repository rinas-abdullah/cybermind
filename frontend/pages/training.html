<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberMind – Training</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand"><span>CyberMind</span></div>
      <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/training" class="active-link">Training</a>
        <a href="/terminal">Terminal</a>
        <a href="/leaderboard-page">Leaderboard</a>
        <a href="/admin" id="admin-link" style="display:none;">Admin</a>
      </div>
    </div>
  </nav>

  <main class="container section-spacing">
    <div class="section-header">
      <h2>Training Missions</h2>
    </div>

    <div class="panel mission-panel">
      <div class="panel-header">
        <span class="pill">Beginner</span>
        <h3 class="mission-title">Network Recon Challenge</h3>
      </div>
      <p>Face realistic cyber attacks and practice your decisions.</p>
      <button id="startScenario" class="btn btn-primary">Start Scenario</button>
    </div>

    <div id="scenarioContainer" class="hidden"></div>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
